services:
  test-db:
    image: postgres:15-alpine
    ports:
      - "5433:5432" # <-- HostPort : ContainerPort
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: local_test_db

  object-storage:
    image: rustfs/rustfs:1.0.0
    ports:
      - "9010:9000"
    environment:
      RUSTFS_ACCESS_KEY: hameln-test
      RUSTFS_SECRET_KEY: hameln-test-secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 15
