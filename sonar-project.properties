sonar.projectKey=hameln-pyrmont_kommunal-app_fed13fb0-857b-4d9a-bc4d-0b98622be893
sonar.qualitygate.wait=true
# Coverage vorübergehend deaktiviert (Quality Gate), bis Test-Reports an SonarQube angebunden sind — https://gitlab.ergosign-projects.com/hameln-pyrmont/kommunal-app/-/issues/544
sonar.coverage.exclusions=**/*
# Asciidoctor-Artefakte (Quelle: docs/*.adoc, siehe ci/docs.gitlab-ci.yml) — nicht manuell pflegen
sonar.exclusions=docs/**/*.html,docs/**/*.pdf

sonar.sources=app,backend,web,docker,monitoring


sonar.tests=backend/UnitTests,app/test,web/bereich-a,web/bereich-b
sonar.test.inclusions=\
  **/UnitTests/**,\
  **/test/**,\
  **/*_test.dart,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*Test*.cs
# Test coverage (native scanner properties; wildcards supported for .NET Cobertura).
sonar.cs.cobertura.reportsPaths=backend/artifacts/cobertura/**/coverage.cobertura.xml
sonar.junit.reportPaths=backend/artifacts/UnitTests-test-result.xml
sonar.dart.lcov.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=web/bereich-b/coverage/lcov.info

# Build/tool caches (not sources; .pub-cache/.fvm remain on disk via CI for Dart resolution).
sonar.exclusions=\
  **/build/**,\
  **/.dart_tool/**,\
  **/.pub-cache/**,\
  **/.fvm/**,\
  **/node_modules/**,\
  **/android/.gradle/**,\
  **/ios/Pods/**,\
  **/ios/.symlinks/**,\
  **/obj/**,\
  **/bin/**,\
  **/dist/**,\
  **/.next/**,\
  app/assets/**,\
  **/Assets.xcassets/**,\
  app/android/**/res/**,\
  **/public/fonts/**,\
  **/dataseeder/media/**,\
  app/integration_test/docs/**,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.webp,\
  **/*.ico,\
  **/*.pdf,\
  **/*.ttf,\
  **/*.otf,\
  **/*.woff,\
  **/*.woff2
