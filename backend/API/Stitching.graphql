    where: NewsArtikel_where
    sort: String
    page: Int
    limit: Int
  ): NewsArtikels
    @allowAnonymous
    @delegate(schema: "BereichB", path: "NewsArtikels")
  veranstalungskalender(id: String!): Veranstaltungskalender
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Veranstaltungskalender")
  veranstaltungskalender(id: String!): Veranstaltungskalender
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Veranstaltungskalender")
  veranstaltungskalenderList(
    where: Veranstaltungskalender_where
    sort: String
    page: Int
    limit: Int
  ): Veranstaltungskalenders
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Veranstaltungskalenders")
  aufruf(id: String!): Aufrufe
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Aufrufe")
  aufrufeList(
    where: Aufrufe_where
    sort: String
    page: Int
    limit: Int
  ): Aufrufes
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Aufrufes")
  wettermesspunkteList(
    where: Wettermesspunkte_where
    sort: String
    page: Int
    limit: Int
  ): Wettermesspunktes
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Wettermesspunktes")
  poi(id: String!): Poi
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Poi")
  pois(where: Poi_where, sort: String, limit: Int): Pois
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Pois")
  poiCategories(
    where: PoiCategory_where
    sort: String
    limit: Int
  ): PoiCategories
    @allowAnonymous
    @delegate(schema: "BereichB", path: "PoiCategories")
  sensoren(where: Sensoren_where, sort: String, limit: Int): Sensorens!
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Sensorens")
  sensor(id: String!): Sensoren
    @allowAnonymous
    @delegate(schema: "BereichB", path: "Sensoren")
  sensorArten(where: SensorArt_where): SensorArts!
    @allowAnonymous
    @delegate(schema: "BereichB", path: "SensorArts")
  untereinheitList(where: Untereinheit_where, limit: Int): Untereinheits
