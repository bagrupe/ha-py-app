extend type Kommune {
  bereichBId: ID!
    @delegate(
      schema: "BereichB"
      path: "KommuneByBereichAId(kommuneId: $fields:id).id"
    )
  name: String!
    @delegate(
      schema: "BereichB"
      path: "KommuneByBereichAId(kommuneId: $fields:id).name"
    )
  design: KommuneDesign
    @delegate(
      schema: "BereichB"
      path: "KommuneByBereichAId(kommuneId: $fields:id).design"
    )
  defaultPosition: [Float]!
    @delegate(
      schema: "BereichB"
      path: "KommuneByBereichAId(kommuneId: $fields:id).defaultPosition"
    )
  geoFlaechen: GeoFlaechen!
    @delegate(
      schema: "BereichB"
      path: "GeoflaechenByBereichAId(kommuneId: $fields:id)"
    )
  isPointInGeoflaeche(name: String!, position: Position!): IsInside!
    @delegate(
      schema: "BereichB"
      path: "IsPointInGeoflaeche(kommuneId: $fields:id, name: $arguments:name, position: $arguments:position)"
    )
  lizenzen: BereichBKommune_Lizenzen!
    @delegate(
      schema: "BereichB"
      path: "KommuneByBereichAId(kommuneId: $fields:id).lizenzen"
    )
  analytics: BereichBKommune_Analytics!
    @delegate(
      schema: "BereichB"
      path: "KommuneByBereichAId(kommuneId: $fields:id).analytics"
    )
  rechtsTexte: BereichBKommune_Legal!
    @delegate(
      schema: "BereichB"
      path: "KommuneByBereichAId(kommuneId: $fields:id).legal"
    )
}

extend type Sensoren_Felder {
  historie(duration: HistoryMode!): [SensorHistorieEintrag!]!
    @delegate(
      schema: "Internal"
      path: "historie(sensorname: $fields:sensorname, feldname: $fields:name, duration: $arguments:duration, fetch: $fields:hasHistorie)"
    )
}
