services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: hameln-prometheus
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      BEREICH_B_PORT: ${BEREICH_B_PORT:-3001}
      BEREICH_A_PORT: ${BEREICH_A_PORT:-3000}
      STELE_PORT: ${STELE_PORT:-8080}
      LOCAL_APP_HOST: ${LOCAL_APP_HOST:-}
      LOCAL_BACKEND_PORT: ${LOCAL_BACKEND_PORT:-8080}
      LOCAL_BEREICH_B_PORT: ${LOCAL_BEREICH_B_PORT:-3001}
      LOCAL_BEREICH_A_PORT: ${LOCAL_BEREICH_A_PORT:-3000}
      LOCAL_STELE_PORT: ${LOCAL_STELE_PORT:-8080}
      LOCAL_APP_DOMAIN: ${LOCAL_APP_DOMAIN:-}
      LOCAL_STELE_DOMAIN: ${LOCAL_STELE_DOMAIN:-}
      STAGING_SERVER_IP: ${STAGING_SERVER_IP:-}
      STAGING_APP_DOMAIN: ${STAGING_APP_DOMAIN:-}
      STAGING_STELE_DOMAIN: ${STAGING_STELE_DOMAIN:-}
      PREPROD_SERVER_IP: ${PREPROD_SERVER_IP:-}
      PREPROD_APP_DOMAIN: ${PREPROD_APP_DOMAIN:-}
      PREPROD_STELE_DOMAIN: ${PREPROD_STELE_DOMAIN:-}
      PRODUCTION_SERVER_IP: ${PRODUCTION_SERVER_IP:-}
      PRODUCTION_APP_DOMAIN: ${PRODUCTION_APP_DOMAIN:-}
      PRODUCTION_STELE_DOMAIN: ${PRODUCTION_STELE_DOMAIN:-}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus-data:/prometheus
    depends_on:
      - blackbox
      - pushgateway
    networks:
      - hameln-monitoring
    ports:
      - "9090:9090"

  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: hameln-pushgateway
    restart: unless-stopped
    networks:
      - hameln-monitoring
    ports:
      - "9091:9091"

  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    container_name: hameln-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - hameln-monitoring
    ports:
      - "9115:9115"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: hameln-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-https://monitoring.example.invalid/}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-monitoring@localhost}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Hameln Monitoring}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${GF_PORT:-3000}:3000" # TODO remove this once we have a proper domain
    networks:
      - hameln-monitoring

  proxy:
    profiles:
      - tls
    image: nginx:1.29.4-alpine
    container_name: hameln-monitoring-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/reverse-proxy.conf:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - grafana
    networks:
      - hameln-monitoring

  certbot:
    profiles:
      - tls
    image: certbot/certbot:v5.3.1
    container_name: hameln-monitoring-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - hameln-monitoring

volumes:
  prometheus-data:
  grafana-data:
  certbot-conf:
  certbot-www:

networks:
  hameln-monitoring:
    name: hameln-monitoring
