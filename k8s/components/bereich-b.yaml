name: "bereich-b"
ingress:
  paths:
    - /cms
  cors: true
deployment:
  port: 3000
  image:
    example: true
    name: web-bereich-b
  resources:
    requests:
      cpu: 200m
      memory: 250Mi
    limits:
      memory: 1Gi
  secrets: components/bereich-b.env
  initContainers:
    - name: check-mongo-ready
      image: busybox:1.36
      command: [ 'sh', '-c', 'until nc -z mongo-{{ .root.Release.Name }} 27017; do echo waiting for mongodb; sleep 2; done;' ]
  env:
    - name: MONGODB_URI
      value: mongodb://mongo-{{ .root.Release.Name }}/bereich-b
    - name: PAYLOAD_PUBLIC_SERVER_URL
      value: https://{{ .root.Release.Name }}.internal.example.invalid
    - name: ENABLE_DATASEEDER
      value: "{{ true | quote }}"
