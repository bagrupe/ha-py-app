      }
    }
  }
}

mutation KategorieAusblendungAufheben(
  $input: KategorieAusblendungAufhebenInput!
) {
  kategorieAusblendungAufheben(input: $input) {
    success
    errors {
      __typename
      ... on Error {
        message
      }
    }
  }
}

fragment Kategorie on Kategorie {
  id
  parentId
  untereinheitId
  istWurzel
  name
  ziel {
    art
    organisationseinheitId
    mitarbeiterGruppeId
    dienstleisterId
  }
}
