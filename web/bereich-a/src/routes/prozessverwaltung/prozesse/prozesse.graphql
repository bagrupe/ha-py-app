}

mutation ProzessAktivieren($input: ProzessAktivierenInput!) {
  prozessAktivieren(input: $input) {
    prozess {
      id
      deaktiviertAm
    }
    errors {
      __typename
      ... on Error {
        message
      }
    }
  }
}

mutation assignProzessTag($prozessId: UUID!, $tagId: UUID!) {
  assignProzessTag(input: {prozessId: $prozessId, tagId: $tagId}) {
    __typename
    prozess {
      id
      name
      tags {
        id
        tag
      }
    }
    errors {
      __typename
      ... on Error {
        message
      }
    }
  }
}
