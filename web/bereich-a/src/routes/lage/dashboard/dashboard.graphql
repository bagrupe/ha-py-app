fragment DashboardMeldung on Ausfuehrung {
  id
  meldungsnummer
  createdAt
  abgeschlossenAm
  ereignisStatus
  klasse
  benoetigteAusruestung
  moeglicherNotfall
  notfallPruefung
  klaerungSeit
  klaerungGrund
  klaerungKommentar
  verwerfenGrund
  externeStelle
  externKommentar
  anzahlBestaetigungen
  lage {
    gebietId
    gebietName
  }
  einheit {
    id
  }
  istZustaendigkeit {
    mitarbeiterGruppeId
  }
  slotValues(
    where: {slotName: {in: ["kategorie", "beschreibung", "adresse"]}}
  ) {
    slotName
    ... on PlainSlotValue {
      value
    }
  }
}

fragment DashboardLage on Lage {
  id
  title
  status
  warningText
  meldewegPausiertSeit
  gebiete {
    id
    gebietId
    status
    liveAt
  }
}

fragment DashboardGebiet on Gebiet {
  id
  name
  geometry
  einsatzleitungen {
    id
    name
  }
}

fragment DashboardEinheit on Einheit {
  id
  name
  ausruestung
  mitarbeiterGruppeId
}

query DashboardStammdaten {
  lagen {
    ...DashboardLage
  }
  gebiete {
    ...DashboardGebiet
  }
  einheiten {
    ...DashboardEinheit
  }
}

query DashboardMeldungen($lageId: UUID!, $offen: Boolean) {
  lageMeldungen(lageId: $lageId, offen: $offen) {
    ...DashboardMeldung
  }
}

mutation DashboardEinheitZuweisen($input: MeldungEinheitZuweisenInput!) {
  meldungEinheitZuweisen(input: $input) {
    ausfuehrung {
      ...DashboardMeldung
    }
    errors {
      __typename
      ... on Error {
        message
      }
    }
  }
}

