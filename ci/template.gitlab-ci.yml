# Defines the base implementation and rules for all push jobs.
.push-template:
  rules:
    - if: $TARGET_ENV == "preprod" || $TARGET_ENV == "staging" || $TARGET_ENV == "production"

# Defines the base implementation and rules for all package jobs.
.package-template:
  rules:
    - if: $TARGET_ENV == "preprod" || $TARGET_ENV == "staging" || $TARGET_ENV == "production"

# Defines the base implementation and rules for all deployment jobs.
.deployment-template:
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-.*$/
      when: never
    - if: $TARGET_ENV == "preprod" || $TARGET_ENV == "staging"
      when: on_success
    - if: $TARGET_ENV == "production"
      when: manual

# Defines the base implementation of the release step.
# Uses a template for the release notes
.release-template:
  stage: release
  # Use the official release-cli image (contains the tool + basic shell)
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script: |
    apk add --no-cache bash git coreutils gettext curl jq
    echo "Creating release for $CI_COMMIT_TAG"

    # Determine the stage suffix based on the environment
    if [ "$TARGET_ENV" = "staging" ]; then
      STAGE_SUFFIX="-staging"
    elif [ "$TARGET_ENV" = "preprod" ]; then
      STAGE_SUFFIX="-RC"
    else
      STAGE_SUFFIX=""
    fi

    # Find the previous tag for THIS component (e.g., the previous app-v* tag)
    # We use 'git describe' to find the closest tag matching the prefix, excluding the current one
    PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match="${COMPONENT}-v*${STAGE_SUFFIX}*" ${CI_COMMIT_TAG}^ 2>/dev/null || echo "")

    # Changelog from commits (Changelog: trailer); uses curl to GitLab repository/compare API (see .gitlab/scripts/generate_changelog.sh)
    export CI_PROJECT_URL
    if [ -n "$PREVIOUS_TAG" ]; then
      echo "Comparing $CI_COMMIT_TAG against $PREVIOUS_TAG"
      export GITLAB_CHANGELOG=$(bash .gitlab/scripts/generate_changelog.sh release "$PREVIOUS_TAG" "$CI_COMMIT_TAG")
    else
      echo "No previous tag found for $COMPONENT. Generating from start of history."
      export GITLAB_CHANGELOG=$(bash .gitlab/scripts/generate_changelog.sh release "" "$CI_COMMIT_TAG")
    fi

    bash .gitlab/scripts/get_docker_images.sh $TARGET_ENV ./.env

    # Load variables and export them so envsubst can see them
    source ./.env
    export CI_PROJECT_URL TARGET_ENV RELEASE_DESCRIPTION BACKEND_IMAGE_VERSION WEB_BEREICH_A_IMAGE_VERSION WEB_BEREICH_B_IMAGE_VERSION APP_IMAGE_VERSION COMPONENT GITLAB_CHANGELOG

    # Calculate release date
    RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

    # Full issues report (artifact + assets link); extract builds the short list for release notes
    bash .gitlab/scripts/fetch_issues.sh $TARGET_ENV $CI_COMMIT_TAG
    export GITLAB_ISSUE_SUMMARY="$(bash .gitlab/scripts/extract.sh "issues_${CI_COMMIT_TAG}.md")"

    # Generate the description file from the template
    #    envsubst replaces the $VARIABLES in your txt file with actual values
    envsubst < .gitlab/release_note_templates/release_note_templates.txt > release_notes.md

    # Create the release using the cli tool.
    release-cli create \
      --name "$RELEASE_NAME" \
      --description release_notes.md \
      --tag-name "$CI_COMMIT_TAG" \
      --ref "$CI_COMMIT_TAG" \
      --released-at "$RELEASE_DATE" \
      --assets-link "{\"name\":\"Issues Report\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/issues_${CI_COMMIT_TAG}.md\"}"
  artifacts:
    paths:
      - issues_${CI_COMMIT_TAG}.md
    expire_in: 1 week

