# SSH Connection Template

.ssh-connection:
  image: bash:3.0.22
  before_script: |
    # Install ssh-agent if not already installed, it is required by Docker.
    apk update && apk add rsync && apk add openssh-client git && apk add curl jq
    eval $(ssh-agent -s)
    ##
    ## Give the right permissions, otherwise ssh-add will refuse to add files
    ## Add the SSH key stored in SSH_PRIVATE_KEY file type CI/CD variable to the agent store
    ##
    chmod 400 "$SSH_PRIVATE_KEY"
    ssh-add "$SSH_PRIVATE_KEY"

    ##
    ## Create the SSH directory and give it the right permissions
    ##
    mkdir -p ~/.ssh
    chmod 700 ~/.ssh
    ssh-keyscan -H ${SERVER_IP} >> ~/.ssh/known_hosts
    ssh deploy_user@${SERVER_IP} "echo -n '✅ Connected successfully as '; whoami"

# Pipelines that run SonarQube analysis (main + MRs targeting default branch).
.sonar-analysis-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_DEFAULT_BRANCH == $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
