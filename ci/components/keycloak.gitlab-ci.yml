################################################
# PACKAGE STAGE
################################################

package:keycloak:
  stage: package
  extends: [.package-template]
  tags:
    - docker-build-new
  needs: []
  script:
    - echo "Building version keycloak-${IMAGE_TAG#*-}"
    - docker build -t $CI_REGISTRY_IMAGE/keycloak:keycloak-"${IMAGE_TAG#*-}" -f docker/keycloak/Dockerfile docker/keycloak/.
  rules:
    - if: $CI_COMMIT_TAG =~ /^backend-.*$/
      when: on_success

push:keycloak:
  stage: push
  extends: [.push-template]
  tags:
    - docker-build-new
  needs: ["package:keycloak"]
  script:
    - docker login -u "gitlab-ci-token" -p $CI_JOB_TOKEN $CI_REGISTRY
    - echo "Push $CI_REGISTRY_IMAGE/keycloak:keycloak-"${IMAGE_TAG#*-}" to registry"
    - docker push $CI_REGISTRY_IMAGE/keycloak:keycloak-"${IMAGE_TAG#*-}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^backend-.*$/
      when: on_success

# Deployment happens in deployment.gitlab-ci.yml on the backend tag trigger
