include:
  - local: "/ci/colors.yml"
  - local: "ci/template.gitlab-ci.yml"
  - local: ci/flutter.gitlab-ci.yml
  - local: ci/components/app.gitlab-ci.yml

variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"

################################################
# Deployment start
################################################

deployment:start:
  stage: deploy
  extends:
    - .deployment-template
    - .ssh-connection
  tags:
    - docker
  needs:
    - job: push:backend
      optional: true
    - job: push:web-bereich-a
      optional: true
    - job: push:web-bereich-b
      optional: true
    - job: push:stele
      optional: true
    - job: push:keycloak
      optional: true
  script: |

    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "💾 Get environment variables from gitlab"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    cat "$DEPLOYMENT_ENV_FILE" >> ./.env
    cat "$DOTNET_ENV_FILE" >> ./.dotnet_env

    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "⬇️ Get tags"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    bash .gitlab/scripts/get_docker_images.sh $TARGET_ENV ./.env

    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "🌐 Render nginx reverse proxy config"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    apk add --no-cache gettext coreutils
    bash .gitlab/scripts/render_reverse_proxy.sh ./.env ./reverse-proxy.config
    MOUNT_POINT="$(grep -E '^MOUNT_POINT=' ./.env | tail -1 | cut -d= -f2- | tr -d '\r')"
    if [ -z "$MOUNT_POINT" ]; then
      echo "MOUNT_POINT is not set in DEPLOYMENT_ENV_FILE" >&2
      exit 1
    fi

    LAGEHELFER_CONTAINER_PATH="/opt/lagehelfer-seed"

    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "🌱 LageHelfer-Seed (Package Registry)"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    ssh deploy_user@${SERVER_IP} "mkdir -p ${MOUNT_POINT}/lagehelfer-seed"

    if grep -qE '^DataSeeder__LageHelferEnabled=true' ./.dotnet_env 2>/dev/null; then
      mkdir -p ./lagehelfer-seed-out
      chmod +x .gitlab/scripts/download_generic_package.sh
      bash .gitlab/scripts/download_generic_package.sh ./lagehelfer-seed-out
      scp -qr ./lagehelfer-seed-out/. deploy_user@${SERVER_IP}:${MOUNT_POINT}/lagehelfer-seed/
      rm -rf ./lagehelfer-seed-out

      if grep -qE '^DataSeeder__LageHelferSeedPath=' ./.dotnet_env; then
        sed -i.bak "s|^DataSeeder__LageHelferSeedPath=.*|DataSeeder__LageHelferSeedPath=${LAGEHELFER_CONTAINER_PATH}|" ./.dotnet_env
        rm -f ./.dotnet_env.bak
      else
        echo "DataSeeder__LageHelferSeedPath=${LAGEHELFER_CONTAINER_PATH}" >> ./.dotnet_env
      fi
    else
      echo "DataSeeder__LageHelferEnabled ist nicht true — Registry-Download übersprungen."
    fi

    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "🚛 Copy files to the remote server"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"
    scp -q docker/docker-compose.yml deploy_user@${SERVER_IP}:/home/deploy_user/deployment/
    scp -qr docker/postgres/init deploy_user@${SERVER_IP}:/home/deploy_user/deployment/postgres/
    scp -qr docker/mongodb/init deploy_user@${SERVER_IP}:/home/deploy_user/deployment/mongodb/
    ssh deploy_user@${SERVER_IP} "mkdir -p /home/deploy_user/deployment/keycloak/themes"
    scp -q docker/keycloak/realm-kommunalapp.json deploy_user@${SERVER_IP}:/home/deploy_user/deployment/keycloak/
    scp -qr docker/keycloak/themes/kommunalapp deploy_user@${SERVER_IP}:/home/deploy_user/deployment/keycloak/themes/
    scp -q ./.env deploy_user@${SERVER_IP}:/home/deploy_user/deployment/.env
    scp -q ./.dotnet_env deploy_user@${SERVER_IP}:/home/deploy_user/deployment/.dotnet_env

    scp -q ./reverse-proxy.config deploy_user@${SERVER_IP}:${MOUNT_POINT}/reverse-proxy.config

    # At this line the ssh connection starts and all commands below will be executed on the remote server.
    ssh deploy_user@${SERVER_IP} << ENDSSH
    set -e # Exit immediately if a command exits with a non-zero status
    cd /home/deploy_user/deployment/

    echo ""
    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "🔑 Login to registry via deploy token"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    echo "${GITLAB_DEPLOY_TOKEN_PW}" | docker login ${CI_REGISTRY} -u "${GITLAB_DEPLOY_TOKEN_USER}" --password-stdin


    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "🛑 Stop docker containers"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    docker compose -f ./docker-compose.yml -p hameln-pyrmont --env-file ./.env down || (echo "No running containers found! Continue with fetching new images")


    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "⬇️ Fetch new docker images"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    docker compose -f ./docker-compose.yml -p hameln-pyrmont --env-file ./.env pull

    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "🚀 Start docker containers"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    docker compose -f ./docker-compose.yml -p hameln-pyrmont --env-file ./.env up -d --force-recreate



    echo -e "${GREEN}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "✅ Deployment completed"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "🧹 Clean up"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    rm -f ./.env ./.dotnet_env
    ENDSSH

  environment:
    name: $TARGET_ENV

################################################
# Deployment stop
################################################

deployment:stop:
  stage: deploy
  extends:
    - .deployment-template
    - .ssh-connection
  tags:
    - docker
  script: |

    echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
    echo -e "💾 Get environment variables from gitlab"
    echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

    cat "$DEPLOYMENT_ENV_FILE" >> ./.env
    cat "$DOTNET_ENV_FILE" >> ./.dotnet_env

    scp -q ./.env deploy_user@${SERVER_IP}:/home/deploy_user/deployment/.env
    scp -q ./.dotnet_env deploy_user@${SERVER_IP}:/home/deploy_user/deployment/.dotnet_env

    # At this line the ssh connection starts and all commands below will be executed on the remote server.
    ssh deploy_user@${SERVER_IP} << ENDSSH
      set -e # Exit immediately if a command exits with a non-zero status
      cd /home/deploy_user/deployment/

      echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
      echo -e "🛑 Stop docker containers"
      echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

      docker compose -f ./docker-compose.yml --env-file ./.env -p hameln-pyrmont down --remove-orphans || true

      echo -e "${BLUE}--------------------------------------------------------------------------------------------------------------------------"
      echo -e "🧹 Clean up"
      echo -e "--------------------------------------------------------------------------------------------------------------------------${RESET}"

      rm -f ./.env ./.dotnet

    ENDSSH
  allow_failure: true
  environment:
    name: $TARGET_ENV
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-.*$/
      when: never
    - if: $TARGET_ENV == "preprod" || $TARGET_ENV == "staging"  || $TARGET_ENV == "production"
      when: manual

# Flutter app jobs for publishing to iOS and Android store.

#########################################################################
# PRE-MERGE CHECKS
#########################################################################
version check:
  stage: deploy
  image:
    name: alpine/git
    entrypoint: [""]
  tags:
    - docker
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache bash
    - chmod +x ./.gitlab/scripts/check_version.sh
    - bash ./.gitlab/scripts/check_version.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'

#########################################################################
# PUBLISH ANDROID
#########################################################################

.publish:android:template:
  stage: deploy
  tags:
    - flutter-ha-py
  before_script:
    - gem install rake
    - gem install fastlane
  script:
    - cd app/android
    - bundle install
    - bundle exec fastlane internalplaystore --verbose

.publish:android:playstore:
  extends: .publish:android:template
  needs:
    - job: build:app-android
      artifacts: true
      optional: true
    - job: build android staging
      artifacts: true
      optional: true

publish:android:playstore:production:
  variables:
    AAB_PATH: "../build/app/outputs/bundle/productionRelease/app-production-release.aab"
    APP_IDENTIFIER: "de.landkreis.hapy.app"
  extends:
    - .publish:android:playstore
  needs:
    - job: build:app-android
      artifacts: true
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-.*$/ && $TARGET_ENV == "production"

publish:android:playstore:preprod:
  variables:
    AAB_PATH: "../build/app/outputs/bundle/preprodRelease/app-preprod-release.aab"
    APP_IDENTIFIER: "de.landkreis.hapy.app.preprod"
    GOOGLE_PLAY_STORE_JSON_FILE_RAW: $
  extends:
    - .publish:android:playstore
  needs:
    - job: build:app-android
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-.*$/ && $TARGET_ENV == "preprod"
      when: on_success

publish:android:playstore:staging:
  variables:
    AAB_PATH: "../build/app/outputs/bundle/stagingRelease/app-staging-release.aab"
    APP_IDENTIFIER: "de.landkreis.hapy.app.staging"
    GOOGLE_PLAY_STORE_JSON_FILE_RAW: $
  extends:
    - .publish:android:playstore
  needs:
    - job: build:app-android
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-.*$/ && $TARGET_ENV == "staging"
      when: on_success

#########################################################################
# PUBLISH iOS
#########################################################################
.publish:ios:testflight:
  extends: [.flutter]
  stage: deploy
  variables:
    SOURCE_DIR: app
    MATCH_PASSWORD: $MATCH_PASSWORD_TESTFLIGHT
  tags:
    - flutter-ha-py
  script:
    - fvm dart run dart_pubspec_licenses:generate --json --ignore app -o "$CI_PROJECT_DIR/app/assets/licenses/packages.json"
    - >
      fvm flutter build ios --config-only --release --no-codesign
      --no-tree-shake-icons
      --flavor "$APP_SCHEME"
      --dart-define=SENTRY_RELEASE=$CI_COMMIT_REF_SLUG
      --dart-define-from-file=$APP_ENV_FILE
    - cd ios
    # Pod install is required to generate the Xcode project file as long as cocoapods is used for dependency management.
    - pod install
    - bundle install
    - bundle exec fastlane publish_testflight --verbose
  artifacts:
    when: always
    paths:
      - app/ios/fastlane/build
    expire_in: 1 hr
  environment:
    name: $TARGET_ENV

publish:ios:testflight:production:
  variables:
    APP_IDENTIFIER: "de.landkreis.hapy.app"
    MATCH_GIT_BRANCH: "hameln-pyrmont-organization"
    ISSUER_ID: $APPSTORE_CONNECT_ISSUER_ID
    MATCH_PASSWORD: $MATCH_PASSWORD_TESTFLIGHT
    APPSTORE_CONNECT_API_KEY: $APPSTORE_CONNECT_API_KEY
    APPSTORE_CONNECT_API_KEY_ID: $APPSTORE_CONNECT_API_KEY_ID
    APP_SCHEME: "production"
  extends:
    - .publish:ios:testflight
  needs:
    - job: build:app-ios
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-.*$/ && $TARGET_ENV == "production"
      when: manual
    - when: never

publish:ios:testflight:preprod:
  variables:
    APP_IDENTIFIER: "de.landkreis.hapy.app.preprod"
    MATCH_GIT_BRANCH: "hameln-pyrmont-organization"
    ISSUER_ID: $APPSTORE_CONNECT_ISSUER_ID
    MATCH_PASSWORD: $MATCH_PASSWORD_TESTFLIGHT
    APPSTORE_CONNECT_API_KEY: $APPSTORE_CONNECT_API_KEY
    APPSTORE_CONNECT_API_KEY_ID: $APPSTORE_CONNECT_API_KEY_ID
    APP_SCHEME: "preprod"
  extends:
    - .publish:ios:testflight
  needs:
    - job: build:app-ios
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-.*$/ && $TARGET_ENV == "preprod"
      when: on_success

publish:ios:testflight:staging:
  variables:
    APP_IDENTIFIER: "de.landkreis.hapy.app.staging"
    MATCH_GIT_BRANCH: "hameln-pyrmont-organization"
    ISSUER_ID: $APPSTORE_CONNECT_ISSUER_ID
    MATCH_PASSWORD: $MATCH_PASSWORD_TESTFLIGHT
    APPSTORE_CONNECT_API_KEY: $APPSTORE_CONNECT_API_KEY
    APPSTORE_CONNECT_API_KEY_ID: $APPSTORE_CONNECT_API_KEY_ID
    APP_SCHEME: "staging"
  extends:
    - .publish:ios:testflight
  needs:
    - job: build:app-ios
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-.*$/ && $TARGET_ENV == "staging"
      when: on_success
