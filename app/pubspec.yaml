patrol:
  app_name: Ha-Py App
  android:
    package_name: de.landkreis.hapy.app.staging
  ios:
    bundle_id: de.landkreis.hapy.app.staging

dependency_overrides:
  device_info_plus: 12.3.0
  flutter_compass:
    git:
      url: https://github.com/AlceoMazza/flutter_compass
      ref: master
  # Support for AGP 8 was added in a major release which requires us to upgrade a lot of dependencies as well as
  # Flutter itself. So for a quicker resolution and less effort, we pin this transitive dependency to the AGP 8 commit for now
  flutter_keyboard_visibility:
    git:
      url: https://github.com/MisterJimson/flutter_keyboard_visibility
      ref: b136e23cff85dbb4385738cee82a8d53363cb4ed
      path: flutter_keyboard_visibility
  js: "0.7.1"

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/translations/
    - assets/licenses/
    - assets/legal/
    - assets/geofences/

  fonts:
    # https://fonts.google.com/noto/specimen/Noto+Sans
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/Noto/NotoSans-Regular.ttf
        - asset: assets/fonts/Noto/NotoSans-Italic.ttf
          style: italic
        - asset: assets/fonts/Noto/NotoSans-Bold.ttf
          weight: 700
    # https://fonts.google.com/specimen/Roboto+Slab
    - family: Roboto Slab
      fonts:
        - asset: assets/fonts/RobotoSlab/RobotoSlab-Regular.ttf
        - asset: assets/fonts/RobotoSlab/RobotoSlab-Bold.ttf
          weight: 700
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

  # Derry scripts
scripts:
  gen: fvm dart run build_runner build
  dev: fvm dart run build_runner watch
  # Run `dart fix` _first_ to enforce trailing commas, which changes the output of `dart format`
  lint: fvm dart fix --apply && fvm dart format lib && fvm flutter analyze
  proxy: adb reverse tcp:5000 tcp:5000 && adb reverse tcp:3001 tcp:3001 && adb
    reverse tcp:3000 tcp:3000
