  id: UUID!
  "Liefert die zugehörige Prozessversion dieses Antrags."
  prozessVersion: ProzessVersion!
  prozessVersionId: UUID!
  "Nutzer, der die Ausführung gestartet hat."
  user: User!
  userId: UUID!
  "Aktuelle Zuständigkeit, steuert Bearbeitungsrechte und Sichtbarkeit im Backoffice."
  istZustaendigkeit: Zustaendigkeit!
  "Zeitpunkt, zu dem die Ausführung manuell abgeschlossen wurde."
  manuellAbgeschlossen: Instant
  "Zeitpunkt, zu dem die Ausführung abgeschlossen wurde (automatisch oder manuell)."
  abgeschlossenAm: Instant
  createdAt: Instant!
  "Aktueller Status der Ausführung (z.B. Bearbeitung durch Bürger, Backoffice oder abgeschlossen)."
  status: AusfuehrungStatus!
  "Lage und Gebiet, die die meldende Person gewählt hat. Null außerhalb des LageHelfers."
  lage: LageAssignment
  "Gibt den verschlüsselten Schlüssel für Bürger zurück, sofern der aktuelle Nutzer der Antragsteller ist."
  sharedKeyEncryptedForBuerger: String!
  "Zeitpunkt der Soft-Löschung. Null bedeutet: nicht gelöscht. Nur für Backoffice-Nutzer mit der Funktionsberechtigung 'Anträge löschen'."
  geloeschtAm: Instant
  "Begründung der Löschung. Nur für Backoffice-Nutzer mit der Funktionsberechtigung 'Anträge löschen'."
  loeschgrund: String
  "Liefert die Bearbeitungshistorie zu diesem Antrag."
  bearbeitungen: [Bearbeitung!]!
  "Gibt den verschlüsselten Schlüssel für die Kommune zurück, sofern der aktuelle Nutzer berechtigt ist."
  sharedKeyEncryptedForKommune: String!
  "Liefert alle Slot-Werte für diesen Antrag (z.B. ausgefüllte Formularfelder). Optional filterbar nach Typ."
  slotValues(imagesRaw: Boolean = false where: SlotValueFilterInput): [SlotValue!]!
  "Liefert den Wert eines bestimmten Slots anhand des Namens. Gibt den letzten Wert zurück, falls mehrfach befüllt."
  slotValue(names: [String!]!): PlainSlotValue
  "Liefert alle Slot-Werte, die im Beschreibungstext der Prozessversion verwendet werden."
  beschreibungstextSlotValues: [SlotValue!]!
  "Liefert den aktuell auszuführenden Schritt dieses Antrags."
  currentSchritt: Schritt!
  "Liefert den Zeitpunkt der letzten Bearbeitung dieses Antrags."
  updatedAt: Instant!
  "Gibt zurück, ob der aktuelle Nutzer diesem Antrag folgt."
  aktuellerNutzerFolgt: Boolean!
  "Bürgerseitige Status-Historie eines Antrags (Ausführung): die vom Prozess-Autor vergebenen Kanten-Statusmeldungen im zeitlichen Verlauf."
  historie: [Historie!]!
  "Backoffice-Verlauf eines Antrags (Ausführung): die persistierten Lebenszyklus-Ereignisse (Eingang, Übernahme, Weiterleitung, Zuständigkeitswechsel, Abschluss) im zeitlichen Verlauf. Für Anträge ohne persistierte Ereignisse (vor Einführung der Protokollierung) leer."
  verlauf: [Historie!]!
  "Maximale Zeichenlänge einer Freitextnachricht an die antragstellende Person (serverseitig validiert)."
  nachrichtMaxLength: Int!
}

