"Repräsentiert ein einzelnes Formularfeld, das in einem Formularschritt verwendet wird. Jedes Feld hat einen technischen Slot-Namen (für Verwendung in Expressions) und zusätzlich eine Bezeichnung."
interface FormularFeld {
  id: UUID!
  "Technischer Name des Slots, unter dem das Feld im Prozess und in Expressions referenziert wird."
  slotName: String!
  "Typ des Felds (z.B. String, Upload, Boolean, etc.)."
  slotValueType: SlotValueType!
  "Angezeigter Name des Feldes im UI."
  angezeigterName: String
  "Zusätzliche Anweisung für das Feld."
  anweisung: String
  "Zugehöriger Formularschritt."
  schritt: FormularSchritt!
  "ID des zugehörigen Formularschritts."
  schrittId: UUID!
  "Reihenfolge (Index) des Feldes im Formular."
  order: Int!
  "Gibt an, ob der Wert verschlüsselt gespeichert wird."
  encrypted: Boolean!
  "Optionales Tag für inhaltliche Gruppierung oder Auswertung."
  inhaltsTag: String
  "Bedingung (Expression Language), unter der das Feld im Formular angezeigt wird."
  istRelevant: BoolExpression!
  "Gibt an ob das Feld optional ist."
  pflichtfeld: Boolean!
  "Gibt an, ob der Wert bei öffentlichen Ausführungen (z.B. Mängelmelder) für Dritte sichtbar ist."
  oeffentlichSichtbar: Boolean!
}

